if(h<.28)c='#2a5db0';else if(h<.36)c='#3b78d8';else if(h<.43)c='#5cc8e6';else if(h<.46)c='#f0d9a0';

else if(t<.28)c=D(m,.5,x,y)?(fo=1,'#2f6f4a'):'#dfe9ef';else if(t>.7&&m<.42)c='#e8c46a';else if(t>.7&&m>.6)c=(fo=1,'#1f8f4a');else if(t>.7)c='#c9b84a';
else c=D(m,.6,x,y)?(fo=1,'#2f8f3a'):!D(m,.35,x,y)?'#8fd14f':'#5fbf4a';

if(h>.46&&x>0&&y>0&&x<W-1&&y<H-1){const sd=hs[i-W-1]-hs[i+W+1];k+=(sd>.006?1:sd<-.006?-1:0)*(h>.7?24:11)}
const o=i*4,[r,g,b]=rgb(c);px[o]=r+k;px[o+1]=g+k;px[o+2]=b+k;px[o+3]=255;if(h<.43)wat.push(i)}

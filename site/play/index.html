.tutorial-close{position:absolute;right:4px;top:4px;width:44px;height:44px;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--ink);font-size:24px}
.tutorial-checklist{display:grid;grid-template-columns:repeat(10,20px);gap:3px;list-style:none;padding:0;margin:8px 0 12px}
.tutorial-check{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;color:var(--mut);font:11px 'Pixelify Sans',monospace}
.tutorial-check[data-done="true"],.tutorial-check[data-current="true"]{border-color:var(--acc);color:var(--acc)}
.tutorial-check[data-current="true"]{background:rgba(242,201,76,.14)}
.tutorial-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:-12px;margin:0 -14px -12px;padding:8px 14px 12px;background:var(--panel)}
.tutorial-actions .btn{min-height:44px}
.tutorial-highlight{position:fixed;z-index:26;border:3px solid var(--acc);border-radius:5px;box-shadow:0 0 0 3px rgba(242,201,76,.18),0 0 18px rgba(242,201,76,.7);pointer-events:none;animation:tutorial-pulse 1.4s ease-in-out infinite}
.tutorial-arrow{position:fixed;z-index:27;color:var(--acc);font:700 28px/1 Outfit,sans-serif;text-shadow:2px 2px 0 #13152b;pointer-events:none}
@keyframes tutorial-pulse{50%{box-shadow:0 0 0 7px rgba(242,201,76,.08),0 0 9px rgba(242,201,76,.38)}}
.topbtn{display:inline-flex;align-items:center;gap:6px}
.topbtn canvas{flex:none}
@media(max-width:520px){#top .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#top #back,#t-zoom,#t-seed{display:none}.topbtn{min-width:40px;justify-content:center}#speed button{min-width:32px;padding:0 4px}}
@media(max-height:640px){.tutorial-checklist{display:none}}
@media(max-height:500px){.tutorial-card{top:var(--below-top,64px);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-height:none;left:120px}#tabs{display:grid;grid-template-columns:repeat(2,auto)}#tabs .lbl{display:none}#tabs button{min-height:40px}#help{display:none}}
@media(max-width:760px){#tabs .lbl{display:none}#insp{display:none}#insp.open{display:block;left:8px;right:8px;width:auto;top:auto;bottom:100px}#help{display:none}#mini canvas{width:110px}#shelf{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;transform:none;max-width:none}#mini{bottom:84px}#top{font-size:13px;gap:4px 10px}}
@media(prefers-reduced-motion:reduce){#loading .barfill{transition:none}.tutorial-highlight{animation:none}}
</style></head><body>
<canvas id="world" data-ia="world_a" role="img"></canvas>
<div id="construction" data-ia="buildings_under"></div>
<div id="top" class="hud"><span id="t-year"></span><span id="t-pop"></span><span id="t-kin"></span><span id="t-seed"></span><span id="t-zoom"></span><button type="button" id="stats-btn" class="topbtn" data-ia="st_open_a" data-it="st_open_a"><span class="lbl" data-i="st_open"></span></button><button type="button" id="settings-btn" class="topbtn" data-ia="set_open_a" data-it="set_open_a"><span class="lbl" data-i="set_open"></span></button><button type="button" id="codex-btn" class="topbtn"><span class="lbl" data-i="cx_open"></span><span class="badge" hidden></span></button><span class="spacer"></span><a href="../" id="back" data-i="back"></a><div id="lang" role="group" data-ia="lang"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button></div></div>
<nav id="tabs" class="hud" role="tablist"></nav>
<div id="shelf" class="hud" role="toolbar"></div>
<aside id="insp" class="hud" aria-live="polite"></aside>
<div id="mini" class="hud" data-ia="minimap" role="button" tabindex="0"><canvas class="px"></canvas></div>
<div id="help" class="hud" data-i="help"></div>
<div id="toast" role="status" aria-live="polite"></div>
<aside id="tutorial" class="tutorial-overlay" role="region" data-ia="tut_label" hidden aria-live="polite" aria-atomic="true"></aside>
<div id="bubble" class="bub" hidden></div>
<div id="flash"></div>
<div id="possess" class="hud" hidden><p data-i="poss_hint"></p><div class="pad"><div class="stick"><div class="knob"></div></div><div class="pad-buttons"></div></div></div>
<div id="loading" hidden><div><h2 data-i="load_title"></h2><div class="barwrap"><div class="barfill"></div></div><span class="stage"></span></div></div>

<dialog id="newworld"><form method="dialog">
<h2 data-i="nw_title"></h2>
<div class="f"><label for="nw-seed" data-i="nw_seed"></label><input id="nw-seed" type="number" min="1" max="999999" required><button type="button" class="btn ghost" id="nw-roll" data-i="nw_random"></button></div>
<p class="note" id="nw-seed-error" role="alert" hidden data-i="seed_bad"></p>
<div class="f"><label for="nw-size" data-i="nw_size"></label><select id="nw-size"></select><span></span></div>
<div class="f"><label for="nw-layout" data-i="nw_layout"></label><select id="nw-layout"></select><span></span></div>
<div class="f"><label for="nw-land" data-i="nw_land"></label><input id="nw-land" type="range" min="15" max="80"><output for="nw-land"></output></div>
<div class="f"><label for="nw-temp" data-i="nw_temp"></label><input id="nw-temp" type="range" min="0" max="100"><output for="nw-temp"></output></div>
<div class="f"><label for="nw-moist" data-i="nw_moist"></label><input id="nw-moist" type="range" min="0" max="100"><output for="nw-moist"></output></div>
<div class="f"><label for="nw-magic" data-i="nw_magic"></label><input id="nw-magic" type="range" min="0" max="100"><output for="nw-magic"></output></div>
<div class="f"><span data-i="nw_races"></span><div class="races" id="nw-races"></div><span></span></div>
<div class="row"><button class="btn ghost" value="cancel" data-i="cancel" formnovalidate></button><button class="btn" value="go" data-i="nw_go"></button></div>
</form></dialog>

<dialog id="saves"><h2 data-i="sv_title"></h2><p class="note" data-i="sv_local"></p><ul class="slots"></ul>
<div class="row"><button class="btn ghost" type="button" id="sv-close" data-i="close"></button></div></dialog>
<dialog id="confirm"><form method="dialog"><h2></h2><p></p><div class="row"><button class="btn ghost" value="cancel" data-i="cancel"></button><button class="btn" value="ok"></button></div></form></dialog>
<dialog id="settings" data-ia="set_title"></dialog>
<dialog id="codex" class="codex" data-ia="cx_title"></dialog>
<dialog id="stats" class="wide" data-ia="st_title"></dialog>
<input type="file" id="import" accept=".ppworld,application/octet-stream" hidden>

<script src="__PP_MAIN__"></script>
</body></html>

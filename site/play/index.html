<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Outfit:wght@400;600&display=swap" crossorigin>
<style>
:root{--bg:#13152b;--ink:#f0ebdc;--mut:#a9aac6;--panel:#1d2044;--panel2:rgba(15,15,35,.86);--line:#363b6e;--acc:#f2c94c;--btn:#f2c94c;--btnt:#1b1e3a;--bad:#d9453d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 Outfit,system-ui,sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.px{image-rendering:pixelated;display:block}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#world.pan{cursor:grab}
.hud{position:fixed;background:var(--panel2);border:2px solid var(--line);font-family:'Pixelify Sans',monospace}
#top{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding:6px 10px;font-size:15px}
#top .spacer{flex:1}
#top a{color:var(--mut);font:500 13px Outfit,sans-serif}
#lang{display:flex}
#lang button{font:700 13px 'Pixelify Sans',monospace;min-width:44px;min-height:36px;border:2px solid var(--btn);background:transparent}
#lang button[aria-pressed="true"]{background:var(--btn);color:var(--btnt)}
#tabs{left:8px;top:var(--below-top,64px);display:flex;flex-direction:column;gap:4px;padding:4px}
#tabs button{display:flex;align-items:center;gap:8px;min-width:44px;min-height:44px;padding:4px 8px;border:2px solid transparent;background:transparent;font:500 14px 'Pixelify Sans',monospace;text-align:left}
#tabs button[aria-selected="true"]{border-color:var(--acc);background:rgba(242,201,76,.12)}
#tabs button:disabled{opacity:.4;cursor:not-allowed}
#tabs .lbl{display:inline}
#shelf{left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:4px;max-width:calc(100% - 16px);overflow-x:auto}
#shelf button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;min-height:52px;padding:4px 6px;border:2px solid transparent;background:transparent;font:500 12px 'Pixelify Sans',monospace;white-space:nowrap}
#shelf button[aria-pressed="true"]{border-color:var(--acc);background:rgba(242,201,76,.12)}
#shelf .sep{width:2px;align-self:stretch;background:var(--line);margin:0 4px}
#shelf label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:0 6px;white-space:nowrap}
#shelf input[type=range]{width:110px;accent-color:var(--acc)}
#shelf select{background:var(--panel);border:2px solid var(--line);padding:4px;max-width:160px}
#mini{right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:3px;cursor:pointer}
#mini canvas{width:180px;height:auto}
#insp{right:8px;top:var(--below-top,64px);width:230px;padding:10px 12px;font-family:Outfit,sans-serif}
#insp h3{font:700 18px 'Pixelify Sans',monospace;margin:0 0 6px}
#insp p{margin:0;color:var(--mut);font-size:14px}
#insp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:14px}
#insp dt{color:var(--mut)}#insp dd{margin:0;text-align:right;font-family:'Pixelify Sans',monospace}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20}
#toast div{background:var(--panel);border:2px solid var(--acc);padding:8px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.4);max-width:90vw}
dialog{background:var(--panel);color:var(--ink);border:3px solid var(--acc);box-shadow:6px 6px 0 rgba(0,0,0,.5);padding:18px 20px;max-width:min(440px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(5,6,20,.6)}
dialog h2{font:700 24px 'Pixelify Sans',monospace;margin:0 0 14px}
dialog .f{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
dialog .f output{font-family:'Pixelify Sans',monospace;min-width:36px;text-align:right}
dialog input[type=number],dialog select{background:var(--bg);border:2px solid var(--line);padding:6px;width:100%}
dialog input[type=range]{width:100%;accent-color:var(--acc)}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{font:600 15px Outfit,sans-serif;background:var(--btn);color:var(--btnt);border:0;padding:10px 16px;min-height:44px;box-shadow:4px 4px 0 var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slots li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:2px solid var(--line);padding:8px}
.slots b{font-family:'Pixelify Sans',monospace}.slots small{display:block;color:var(--mut)}
.slots button{min-height:40px;padding:6px 10px;border:2px solid var(--line);background:transparent}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,11,30,.82);z-index:30}
#loading[hidden]{display:none}
#loading div{width:min(360px,80vw);text-align:center;font-family:'Pixelify Sans',monospace}
#loading h2{font-size:26px;margin:0 0 10px}
#loading .barwrap{height:14px;border:2px solid var(--acc);margin:12px 0 8px}
#loading .barfill{height:100%;width:0;background:var(--acc);transition:width .1s}
#help{left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:260px;padding:6px 8px;font:13px Outfit,sans-serif;color:var(--mut)}
@media(max-width:760px){#tabs .lbl{display:none}#insp{display:none}#insp.open{display:block;left:8px;right:8px;width:auto;top:auto;bottom:100px}#help{display:none}#mini canvas{width:110px}#shelf{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;transform:none;max-width:none}#mini{bottom:84px}#top{font-size:13px;gap:4px 10px}}
@media(prefers-reduced-motion:reduce){#loading .barfill{transition:none}}
</style></head><body>
<canvas id="world" data-ia="world_a" role="img"></canvas>

<div class="f"><label for="nw-seed" data-i="nw_seed"></label><input id="nw-seed" type="number" min="1" max="999999" required><button type="button" class="btn ghost" id="nw-roll" data-i="nw_random"></button></div>
<div class="f"><label for="nw-size" data-i="nw_size"></label><select id="nw-size"></select><span></span></div>
<div class="f"><label for="nw-layout" data-i="nw_layout"></label><select id="nw-layout"></select><span></span></div>
<div class="f"><label for="nw-land" data-i="nw_land"></label><input id="nw-land" type="range" min="15" max="80"><output for="nw-land"></output></div>
<div class="f"><label for="nw-temp" data-i="nw_temp"></label><input id="nw-temp" type="range" min="0" max="100"><output for="nw-temp"></output></div>
<div class="f"><label for="nw-moist" data-i="nw_moist"></label><input id="nw-moist" type="range" min="0" max="100"><output for="nw-moist"></output></div>
<div class="f"><label for="nw-magic" data-i="nw_magic"></label><input id="nw-magic" type="range" min="0" max="100"><output for="nw-magic"></output></div>
<div class="row"><button class="btn ghost" value="cancel" data-i="cancel" formnovalidate></button><button class="btn" value="go" data-i="nw_go"></button></div>
</form></dialog>

<dialog id="saves"><h2 data-i="sv_title"></h2><ul class="slots"></ul>
<div class="row"><button class="btn ghost" type="button" id="sv-close" data-i="close"></button></div></dialog>
<input type="file" id="import" accept=".ppworld,application/octet-stream" hidden>

<script src="__PP_MAIN__"></script>
</body></html>
